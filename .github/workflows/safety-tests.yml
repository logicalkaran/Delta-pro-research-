name: Python safety tests
on:
  push:
    paths:
      - "scalping_system/**"
  pull_request:
    paths:
      - "scalping_system/**"
jobs:
  safety-tests:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scalping_system
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip pytest requests
      - run: python -m compileall -q execution exchange recovery risk storage
      - run: python -m pytest -q execution/test_authoritative_account_risk.py execution/test_production_audit.py risk/test_orchestration_oracle.py exchange/test_delta_state_adapter.py recovery/test_state_reconciler.py
