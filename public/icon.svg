<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#05070c"/>
    </linearGradient>
    <linearGradient id="deltaGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#8b5cf6"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="110" fill="url(#bg)"/>
  <rect width="504" height="504" x="4" y="4" rx="106" fill="none" stroke="#1e293b" stroke-width="4"/>
  
  <!-- Delta Symbol (Triangle) -->
  <polygon points="256,96 416,396 96,396" fill="none" stroke="url(#deltaGrad)" stroke-width="44" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Center Core -->
  <circle cx="256" cy="275" r="28" fill="#06b6d4"/>
  
  <!-- Accent Candlestick Bars in Core -->
  <rect x="252" y="195" width="8" height="36" rx="4" fill="#22c55e"/>
  <rect x="252" y="320" width="8" height="36" rx="4" fill="#ef4444"/>
</svg>
